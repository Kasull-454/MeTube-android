name: Release

# Every push to main builds a signed APK and publishes it as a GitHub release,
# so Obtainium (or any updater) can follow this repository. The tag is
# `build-<run number>`, which also becomes the Android versionCode: it grows
# on every run, so each build installs over the previous one.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions),
# all describing ONE keystore that is created once and then never changed:
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# A new keystore means a different signature, and Android refuses to update
# an installed app across signatures.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Check the signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64 (see the comment at the top of release.yml)"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Write the keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/metube_super/android
        run: |
          echo "$KS" | base64 -d > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > key.properties

      - name: Build the release APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
        working-directory: apps/metube_super

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          cp apps/metube_super/build/app/outputs/flutter-apk/app-release.apk \
            "metube-super-$tag.apk"
          gh release create "$tag" "metube-super-$tag.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatic build of ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
